[project]
name = "task-manager-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Offei", email = "poffei.cs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.0",
    "rich>=15.0.0",
    "typer>=0.24.1",
]

[project.scripts]
task-manager-app = "task_manager_app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "typing-extensions>=4.15.0",
]
